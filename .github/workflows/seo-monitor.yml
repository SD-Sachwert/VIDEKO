name: SEO-Monitor

# Woechentlich die Live-Seite pruefen (scripts/seo-monitor.mjs).
# Ein roter Lauf erzeugt automatisch eine GitHub-Mail – das ist der Alarm.
# Laufzeit ca. 1 Minute, liegt im kostenlosen Actions-Kontingent.
on:
  schedule:
    - cron: '17 6 * * 1' # montags 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/seo-monitor.mjs
