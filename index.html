    <!--
      Alles zwischen den Markern ersetzt scripts/prerender.mjs nach dem Build
      pro Route durch deren eigene Metadaten. Was hier steht, ist der Zustand
      im Dev-Server und der Fallback der Startseite.

      Die strukturierten Daten stehen bewusst NICHT mehr hier fest verdrahtet:
      Rechtstraeger, Anschrift und Kontakt kommen ausschliesslich aus
      src/data/company.js ueber src/data/site.js. Eine zweite, handgepflegte
      Kopie im HTML lief sonst irgendwann auseinander.
    -->
    <!--seo:start-->
    <title>VIDEKO Küchen | Küchenstudio Würzburg</title>
    <meta name="description" content="VIDEKO Küchen – dein Küchenstudio in Würzburg. Küchenplanung, ehrliche Beratung und maßgeschneiderte Küchen für deinen Alltag." />

    <!--
      Der Ersteinstieg ins Terminal.

      Die Seiten werden vorgerendert. Ohne dieses Stueck Skript stuende die
      fertige Aktionsseite schon im ersten Bild — und die Sequenz, die
      danach laeuft, waere eine Wiederholung statt einer Ankunft. Das Skript
      setzt deshalb noch vor dem ersten Bild eine Klasse auf das
      Dokumentelement; das Stylesheet blendet daraufhin alles aus, was erst
      spaeter kommen soll, und stellt die Truhe weit nach hinten.

      Es entscheidet nur, ob die Sequenz ueberhaupt laeuft. Alles Weitere
      macht die Seite selbst. Bewusst klein gehalten, ohne Abhaengigkeiten
      und vollstaendig in try/catch: faellt es aus, ist die Seite einfach
      sofort da.

      Das Sicherheitsnetz am Ende ist wichtiger, als es aussieht: laedt das
      Bundle nicht, nimmt der Zeitschalter die Klasse nach vier Sekunden
      wieder weg (5,5 s — die Sequenz selbst endet nach gut 4 s). Eine dauerhaft unsichtbare Seite waere der schlimmste
      Ausgang. Laeuft die Seite an, stellt sie den Zeitschalter ab und
      taktet selbst.
    -->
    <script>
      ;(function () {
        try {
          if (location.pathname.replace(/\/+$/, '') !== '/terminal') return
          /* Wer ueber einen Zugangslink kommt, kennt die Seite schon. */
          if (location.hash.indexOf('#wieder=') === 0) return
          var s = window.sessionStorage
          var l = window.localStorage
          var wunsch = s.getItem('videko.terminal.introWunsch')
          if (!wunsch) {
            if (s.getItem('videko.terminal.intro')) return
            /* Wer schon eingeloggt ist, kommt nicht zum ersten Mal an. Im
               Testmodus zaehlen dafuer die Testzettel, nicht der echte
               Login — sonst saehe das Labor nie den Ersteinstieg. */
            if (s.getItem('videko.terminal.probe')) {
              if (s.getItem('videko.terminal.probe.videko.terminal.intro')) return
              if (s.getItem('videko.terminal.probe.videko.terminal.sitzung')) return
              if (s.getItem('videko.terminal.probe.videko.terminal.zugang')) return
            } else {
              /* Der Ersteinstieg laeuft einmal pro Sitzung — also einmal pro
                 Tab, nicht ein einziges Mal pro Browser. Der Merkzettel in
                 sessionStorage steht schon oben; hier bleiben nur die beiden
                 dauerhaften Zettel stehen, die sagen, dass jemand die Truhe
                 laengst kennt: wer angemeldet ist oder den Code hat, landet
                 ohnehin nicht auf der verschlossenen Seite. */
              if (l.getItem('videko.terminal.sitzung')) return
              if (l.getItem('videko.terminal.zugang')) return
            }
          }
          document.documentElement.className += ' trm-intro-an'
          window.__trmIntroNetz = window.setTimeout(function () {
            document.documentElement.classList.remove('trm-intro-an')
          }, 5500)
        } catch (e) {
          /* kein Speicher, kein Intro, kein Problem */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
