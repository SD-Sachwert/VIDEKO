<!doctype html>
<html lang="de">

    <!--
      Alles zwischen den Markern ersetzt scripts/prerender.mjs nach dem Build
      pro Route durch deren eigene Metadaten. Was hier steht, ist der Zustand
      im Dev-Server und der Fallback der Startseite.

      Die strukturierten Daten stehen bewusst NICHT mehr hier fest verdrahtet:
      Rechtstraeger, Anschrift und Kontakt kommen ausschliesslich aus
      src/data/company.js ueber src/data/site.js. Eine zweite, handgepflegte
      Kopie im HTML lief sonst irgendwann auseinander.
    -->
    <!--seo:start-->
    <title>VIDEKO Küchen | Küchenstudio Würzburg</title>
    <meta name="description" content="VIDEKO Küchen – dein Küchenstudio in Würzburg. Küchenplanung, ehrliche Beratung und maßgeschneiderte Küchen für deinen Alltag." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://videko-kuechen.de/" />

    <meta property="og:site_name" content="VIDEKO Küchen" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://videko-kuechen.de/" />
    <meta property="og:title" content="VIDEKO Küchen | Küchenstudio Würzburg" />
    <meta property="og:description" content="VIDEKO Küchen – dein Küchenstudio in Würzburg. Küchenplanung, ehrliche Beratung und maßgeschneiderte Küchen für deinen Alltag." />
    <meta property="og:image" content="https://videko-kuechen.de/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VIDEKO Küchen | Küchenstudio Würzburg" />
    <meta name="twitter:description" content="VIDEKO Küchen – dein Küchenstudio in Würzburg. Küchenplanung, ehrliche Beratung und maßgeschneiderte Küchen für deinen Alltag." />
    <meta name="twitter:image" content="https://videko-kuechen.de/og-image.jpg" />
    <!--seo:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
